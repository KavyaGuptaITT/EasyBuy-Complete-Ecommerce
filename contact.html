<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>About - EasyBuy</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <div id="header"></div>
      <main class="contact-page">
      <h1 class="page-title">Get in Touch</h1>
      <p class="contact-intro">
        We’d love to hear from you. Whether you have a question about an order,
        need support, or want to share any feedback to us !! — our team is here to help.
      </p>
      <div class="contact-card">
        <form id="contactForm">
          <div class="form-row">
            <div class="form-group">
              <label>Name</label>
              <input type="text" placeholder="Enter your full name" />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" placeholder="Enter your email address" />
            </div>
          </div>
          <div class="form-group">
            <label>Subject</label>
            <input type="text" placeholder="What is your message about?" />
          </div>
          <div class="form-group">
            <label>Your Message</label>
            <textarea
              rows="5"
              placeholder="Type your message here..."
            ></textarea>
          </div>
          <button class="primary-btn contact-submit-btn">Send Message</button>
        </form>
        <div class="contact-side-box">
          <h3>Contact Information</h3>
          <p>Email: support@easybuy.com</p>
          <p>Phone: +91 12345 67890</p>
          <p>Working Hours:</p>
          <p>Mon-Sat: 9:00 AM – 7:00 PM</p>
          <div class="contact-icon-box">
            <div class="contact-icon">📧</div>
            <div class="contact-icon">📞</div>
            <div class="contact-icon">💬</div>
          </div>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <script src="scripts/loadLayout.js"></script>
    <script>
      loadLayout();
    </script>
    <script type="module" src="scripts/aboutPage.js"></script>
  </body>
</html>
