<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Your Cart</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <div id="header"></div>
    <main class="page-container">
      <h2>Your Cart</h2>
      <section id="fullCartContainer"></section>
      <div class="cart-summary">
        <p id="cartTotal">Total: ₹0</p>
        <button id="checkoutBtn" class="primary-btn">
          Proceed to Checkout
        </button>
      </div>
    </main>
    <div id="footer"></div>
    <script src="scripts/loadLayout.js"></script>
    <script type="module">
      import { initCartPage } from "./scripts/pages/cartPage.js";
      window.loadLayout(() => initCartPage());
    </script>
  </body>
</html>
