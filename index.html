<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EasyBuy - Home</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <div id="header"></div>
    <main>
      <section class="hero">
        <div class="hero-left">
          <h1>Everything You Need. Delivered Smartly.</h1>
          <p>
            Shop electronics, fashion, groceries, books & more with unbeatable
            quality.
          </p>
          <button
            class="hero-btn"
            onclick="
              document
                .getElementById('productContainer')
                .scrollIntoView({ behavior: 'smooth' })
            "
          >
            Start Shopping
          </button>
        </div>
        <div class="hero-right">
          <img src="assets/hero-banner.jpg" alt="Banner" class="hero-image" />
        </div>
      </section>
      <section id="filterContainer" class="filters"></section>
      <section id="productContainer" class="products"></section>
    </main>
    <div id="footer"></div>
    <script src="scripts/loadLayout.js"></script>
    <script type="module">
      import { initHome } from "./scripts/pages/home.js";
      window.loadLayout(() => initHome());
    </script>
  </body>
</html>
